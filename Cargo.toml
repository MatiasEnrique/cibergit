[package]
name = "cibergit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native macOS pull request workspace"
publish = false

[features]
ui-smoke = ["gpui/test-support", "gpui_platform/test-support"]

[[example]]
name = "local_workspace_demo"
required-features = ["ui-smoke"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.1" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.1", features = ["font-kit", "runtime_shaders"] }
gpui-base = "=0.6.1"
# The sidebar installs an AppKit glass/material view of its own; see src/glass.rs.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
raw-window-handle = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smol = "2"
sha2 = "0.10"
gpui-component = { path = "vendor/gpui-component", version = "=0.6.1", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-html", "tree-sitter-css", "tree-sitter-swift", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-ruby", "tree-sitter-sql", "tree-sitter-diff"] }
ropey = "2.0.0-beta.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
